<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <link rel="stylesheet" href="styles/style03.css">
</head>
<body>
    <h1>Mesclagem de celulas</h1>
    <p>Introdugem a tabelas mescladas</p>

    <table>
       <tr>
        <td>A</td>
        <td colspan="2">B</td>
       </tr>

       <tr>
        <td rowspan="3">D</td>
        <td>E</td>
        <td rowspan="2">F</td>
       </tr>

       <tr>
        <td>H</td>
       </tr>

       <tr>
        <td colspan="2">K</td>
       </tr>
    </table>
    
</body>
</html>
